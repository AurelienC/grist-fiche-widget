  } else if(kind==='num'){
    inner = (val==null||val==='')? (ph=true,'Vide') : escapeHtml(String(val));
  } else if((m.wo||{}).widget==='HyperLink'){
    inner = (val==null||val==='')? (ph=true,'Vide') : hyperlinkHtml(val);
  } else {
    inner = (val==null||val==='')? (ph=true,'Vide') : escapeHtml(String(val));
  }

  const label = m.label || k;
  const cls = `prop-val ${ph?'placeholder':''} ${ro?'readonly':''}`;
  const stl = cellStyle(k);
  const roAttr = ro ? `data-ro="1" title="Colonne calculée (formule) — non modifiable ici"` : '';
  const isLink = (m.wo||{}).widget==='HyperLink';
  const isRef = (kind==='ref'||kind==='reflist');
  const acts = (ph || kind==='attach' || refEnc || refListEnc) ? '' : cellActions(k, { copy:true, open:isLink, edit:(!ro && (isLink||isRef)) });
  return `<div class="prop">
      <div class="prop-label">${icon(iconKind(type,false))}<span class="txt">${escapeHtml(label)}</span></div>
      <div class="${cls}" data-key="${k}" ${roAttr} ${stl?`style="${stl}"`:''}>${inner}${acts}</div>
    </div>`;
}
function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ============================================================
   Édition au clic
   ============================================================ */
function bindClicks(){
  // Liens hypertexte : naviguer sans déclencher l'édition de la cellule
  wrap.querySelectorAll('.prop-val .lk, .prop-val .prop-btn').forEach(a=>{
    a.addEventListener('click', e=> e.stopPropagation());
  });
  // Liens dans les champs markdown (corps + sous-tableaux) : ils ouvrent un
  // nouvel onglet (target=_blank) ; on empêche juste l'ouverture de l'éditeur.
  wrap.querySelectorAll('.md a, .st-md a').forEach(a=>{
    a.addEventListener('click', e=> e.stopPropagation());
  });
  // Ouvrir un enregistrement lié (clic sur une pastille de référence)
  wrap.querySelectorAll('.ref-open').forEach(c=>{
    c.addEventListener('click', e=>{
      e.stopPropagation();
      openRecord(c.dataset.openRef, c.dataset.openRow);
    });
  });
  // Bouton « modifier » (liens et références : le clic sur la valeur est déjà pris)
  wrap.querySelectorAll('.cell-act[data-edit-key]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const cell = wrap.querySelector(`[data-key="${CSS.escape(b.dataset.editKey)}"]`);
      if(!cell || cell.dataset.ro) return;
      if(editingKey){ render(); }
      const fresh = wrap.querySelector(`[data-key="${CSS.escape(b.dataset.editKey)}"]`);
      if(fresh) startEdit(fresh);
    });
  });
  // Bouton « copier »
  wrap.querySelectorAll('.cell-act[data-copy-key]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      copyToClipboard(copyValue(b.dataset.copyKey), b);
    });
  });
  // Bouton « ouvrir le lien »
  wrap.querySelectorAll('.cell-act[data-open-key]').forEach(b=>{
    b.addEventListener('click', e=>{
      e.stopPropagation();
      const href = linkHref(CURRENT[b.dataset.openKey]);
      if(href) window.open(href, '_blank', 'noopener');
    });
  });
  wrap.querySelectorAll('[data-key]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const key = el.dataset.key;
      if(el.dataset.ro){ toast('Champ calculé (formule), non modifiable'); return; }
      if(editingKey){ render(); }   // ferme proprement tout éditeur ouvert (et libère editingKey)
      const fresh = wrap.querySelector(`[data-key="${CSS.escape(key)}"]`) || el;
      startEdit(fresh);
    });
  });
}

// Copie dans le presse-papier, avec retour visuel (coche) sur le bouton
async function copyToClipboard(text, btn){
  const ok = ()=>{
    if(!btn) return;
    const prev = btn.innerHTML;
    btn.innerHTML = icon('check'); btn.classList.add('done');
    toast('Copié');
    setTimeout(()=>{ btn.innerHTML = prev; btn.classList.remove('done'); }, 1100);
  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); ok(); return; }
    throw new Error('no clipboard api');
  }catch(_){
    try{ // repli pour iframe/navigateur sans Clipboard API
      const ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok();
    }catch(e){ toast('Copie impossible'); }
  }
}

function startEdit(el){
  const key = el.dataset.key;
  const m = META?.[key] || {};
  const type = m.type || 'Text';
  const kind = typeKind(type);
  const val = CURRENT[key];
  editingKey = key;

  // Titre
  if(el.classList.contains('title')){
    return inlineInput(el, val||'', 'text', v=>commit(key, v));
  }
  // Bloc markdown / texte long
  if(el.dataset.md){
    return editMarkdown(el, key, val||'');
  }
  if(kind==='bool'){
    commit(key, !val); editingKey=null; return;
  }
  if(kind==='choice'){
    return editChoice(el, key, m, val);
  }
  if(kind==='choicelist'){
    return editChoiceList(el, key, m, asList(val));
  }
  if(kind==='date'){
    return editDate(el, key, type, val);
  }
  if(kind==='num'){
    return inlineInput(el, val??'', 'number', v=>commit(key, v===''?null:Number(v)));
  }
  if(kind==='attach'){
    editingKey=null;   // pièces jointes : lecture/téléchargement seulement (clic sur un fichier pour l'ouvrir)
    return;
  }
  if(kind==='ref'){
    return editRef(el, key, m, val);
  }
  if(kind==='reflist'){
    return editRefList(el, key, m, asList(val));   // ids OU libellés : résolus dans le picker
  }
  // texte court
  inlineInput(el, val||'', 'text', v=>commit(key, v));
}

function inlineInput(el, value, htmlType, onSave){
  const input = document.createElement('input');
  input.type = htmlType; input.className='editor'; input.value = value;
  el.replaceWith(input); input.focus(); input.select?.();
  const done = save=>{
    if(save) onSave(input.value);
    editingKey=null; if(!save) render(); 
  };
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){e.preventDefault();done(true);}
    if(e.key==='Escape'){e.preventDefault();done(false);}
  });
  input.addEventListener('blur', ()=>done(true));
}

let mdEditor = null;   // instance Toast UI courante

function editMarkdown(el, key, value){
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const blockEl = el.closest('.body-block');
  const grow = true;                                // éditeur toujours en pleine hauteur
  if(blockEl) blockEl.classList.add('editing-grow');
  const box = document.createElement('div'); box.className='ml-edit grow-edit';

  // Repli si le CDN de l'éditeur n'est pas chargé : ancien textarea + aperçu live
  if(!(window.toastui && toastui.Editor)){
    return editMarkdownFallback(el, key, value);
  }

  const host = document.createElement('div');
  if(grow){ host.style.flex='1 1 auto'; host.style.minHeight='0'; }
  const actions = document.createElement('div'); actions.className='editor-actions';
  actions.innerHTML = `<span class="save-state" style="font-size:11.5px;color:var(--ink-faint)">
      Titres : bouton <b>Tt</b> de la barre · ou onglet <b>Markdown</b> (en bas) pour taper <b>#</b>, <b>##</b>…</span>
      <span class="spacer"></span>
      <button class="btn" data-act="cancel">Annuler</button>
      <button class="btn primary" data-act="save">Fermer</button>`;
  box.append(host, actions);
  el.replaceWith(box);

  mdEditor = new toastui.Editor({
    el: host,
    height: grow ? '100%' : '360px',
    initialEditType: 'wysiwyg',     // démarre en WYSIWYG
    previewStyle: 'tab',
    initialValue: value || '',
    usageStatistics: false,
    theme: dark ? 'dark' : 'default',
    language: 'fr',
    toolbarItems: [
      ['heading','bold','italic','strike'],
      ['hr','quote'],
      ['ul','ol','task'],
      ['table','link'],
      ['code','codeblock'],
    ],
  });
  mdEditor.focus();

  const original = value || '';
  let lastSaved = original, saveTimer = null;
  const stateEl = actions.querySelector('.save-state');
  const flashSaved = ()=>{ if(stateEl){ stateEl.dataset.def = stateEl.dataset.def||stateEl.innerHTML;
      stateEl.innerHTML = '<span style="color:#3a7a3a">✓ Enregistré automatiquement</span>';
      clearTimeout(stateEl._t); stateEl._t = setTimeout(()=>{ stateEl.innerHTML = stateEl.dataset.def; }, 1800); } };

  // Auto-enregistrement (anti-perte) : 1,2 s après la dernière frappe, sans fermer l'éditeur
  const scheduleSave = ()=>{
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{
      if(!mdEditor) return;
      const md = normalizeEmphasis(mdEditor.getMarkdown());
      if(md===lastSaved) return;
      lastSaved = md;
      commit(key, md, {silent:true});   // silent : ne re-rend pas, garde l'éditeur ouvert
      flashSaved();
    }, 1200);
  };
  mdEditor.on('change', scheduleSave);

  const finish = (save)=>{
    clearTimeout(saveTimer);
    const md = mdEditor ? normalizeEmphasis(mdEditor.getMarkdown()) : null;
    if(mdEditor){ try{ mdEditor.destroy(); }catch(_){} mdEditor=null; }
    editingKey=null;
    if(save){
      if(md!=null && md!==lastSaved) commit(key, md); else render();
    } else {
      // Annuler : si des sauvegardes automatiques ont eu lieu, on restaure la valeur d'origine
      if(lastSaved!==original) commit(key, original); else render();
    }
  };
  actions.querySelector('[data-act="save"]').onclick = ()=>finish(true);
  actions.querySelector('[data-act="cancel"]').onclick = ()=>finish(false);
  // Ctrl/⌘+Entrée pour fermer, Échap pour annuler (capture pour passer avant l'éditeur)
  box.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); finish(true); }
    else if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  }, true);
}

/* Repli : éditeur markdown brut + aperçu en direct (si Toast UI indisponible) */
function editMarkdownFallback(el, key, value){
  const box = document.createElement('div'); box.className='ml-edit';
  const ta = document.createElement('textarea'); ta.className='editor'; ta.value=value;
  const prev = document.createElement('div'); prev.className='ml-preview';
  prev.innerHTML = `<div class="lbl">Aperçu</div><div class="md">${renderMd(value)||'<span style="color:var(--ink-faint)">…</span>'}</div>`;
  const hint = document.createElement('div'); hint.className='edit-hint';
  hint.innerHTML = `<span>Markdown : **gras**, # titre, - liste, [lien](url)</span>
                    <span><kbd>⌘/Ctrl + Entrée</kbd> enregistrer · <kbd>Échap</kbd> annuler</span>`;
  box.append(ta, prev, hint);
  el.replaceWith(box); ta.focus();
  const refresh = ()=>{ $('.md',prev).innerHTML = renderMd(ta.value)||'<span style="color:var(--ink-faint)">…</span>'; };
  ta.addEventListener('input', refresh);
  const done = save=>{ if(save) commit(key, normalizeEmphasis(ta.value)); editingKey=null; if(!save) render(); };
  ta.addEventListener('keydown', e=>{
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){e.preventDefault();done(true);}
    if(e.key==='Escape'){e.preventDefault();done(false);}
  });
  ta.addEventListener('blur', ()=>setTimeout(()=>{ if(editingKey===key) done(true); },120));
}

function editChoice(el, key, m, val){
  const wo = m.wo||{}; const choices = wo.choices||[];
  const sel = document.createElement('select'); sel.className='editor';
  sel.innerHTML = `<option value="">— vide —</option>` +
    choices.map(c=>`<option ${c===val?'selected':''}>${escapeHtml(c)}</option>`).join('');
  el.replaceWith(sel); sel.focus();
  const done = save=>{ if(save) commit(key, sel.value||null); editingKey=null; if(!save) render(); };
  sel.addEventListener('change', ()=>done(true));
  sel.addEventListener('blur', ()=>done(true));
  sel.addEventListener('keydown', e=>{ if(e.key==='Escape') done(false); });
}

function editChoiceList(el, key, m, current){
  const wo = m.wo||{}; const choices = wo.choices||[];
  const box = document.createElement('div'); box.className='ml-edit';
  const checks = document.createElement('div'); checks.className='checks';
  checks.innerHTML = choices.map(c=>`<label><input type="checkbox" value="${escapeHtml(c)}"
      ${current.includes(c)?'checked':''}>${escapeHtml(c)}</label>`).join('') ||
      '<span style="color:var(--ink-faint)">Aucun choix défini sur la colonne</span>';
  const hint = document.createElement('div'); hint.className='edit-hint';
  hint.innerHTML = `<span>Enregistré au fur et à mesure</span>
    <span class="right"><kbd>Entrée</kbd>/<kbd>Échap</kbd> fermer <button class="btn primary" data-act="ok" title="Valider (Entrée)">✓</button></span>`;
  const propEl = el.closest('.prop');
  box.append(checks, hint); el.replaceWith(box);
  if(propEl) propEl.classList.add('editing-wide');
  // Comme la RefList : on enregistre à chaque coche sans refermer (commit silencieux).
  checks.querySelectorAll('input').forEach(i=>i.addEventListener('change', ()=>{
    const picked = [...checks.querySelectorAll('input:checked')].map(x=>x.value);
    commit(key, ['L', ...picked], {silent:true});
  }));
  const close = ()=>{ editingKey=null; render(); };
  hint.querySelector('[data-act="ok"]').addEventListener('click', close);
  box.tabIndex=0; box.focus();
  box.addEventListener('keydown', e=>{
    if(e.key==='Escape' || e.key==='Enter'){ e.preventDefault(); close(); }
  });
}

// Sélecteur de référence en type-ahead : ne dessine jamais toute la table cible.
// On filtre en mémoire et on n'affiche qu'un nombre limité de résultats.
const REF_RENDER_LIMIT = 50;

async function refPicker(el, key, m, multi, current){
  const target = refTarget(m.type);
  const visCol = m.visibleCol ? COLREF[m.visibleCol] : null;

  const box = document.createElement('div'); box.className='ml-edit';
  const search = document.createElement('input');
  search.className='editor'; search.placeholder='Rechercher…';
  const list = document.createElement('div'); list.className='checks ref-checks';
  list.innerHTML = '<span style="color:var(--ink-faint)">Chargement…</span>';
  const hint = document.createElement('div'); hint.className='edit-hint';
  hint.innerHTML = `<span class="count"></span><span class="right"><kbd>${multi?'Entrée':'Échap'}</kbd>${multi?'/<kbd>Échap</kbd> fermer':' annuler'}${multi?' <button class="btn primary" data-act="ok" title="Valider (Entrée)">✓</button>':''}</span>`;
  const propEl = el.closest('.prop');
  box.append(search, list, hint); el.replaceWith(box); search.focus();
  if(propEl) propEl.classList.add('editing-wide');
  const okBtn = box.querySelector('[data-act="ok"]');
  if(okBtn) okBtn.addEventListener('click', ()=>{ editingKey=null; render(); });

  const opts = await refOptions(target, visCol);
  if(editingKey!==key) return;
  // libellés en minuscules précalculés une seule fois (pour filtrer vite sur 39k lignes)
  const idx = opts.map(o=>({ id:o.id, label:o.label, lc:String(o.label).toLowerCase() }));
  const byId = new Map(idx.map(o=>[o.id,o.label]));
  const byLabel = new Map(idx.map(o=>[String(o.label), o.id]));

  // La valeur courante peut être des IDs (nombres) OU des libellés (chaînes) selon Grist.
  // On résout chaque jeton vers un ID de ligne.
  const resolve = tok=>{
    const n = Number(tok);
    if(Number.isInteger(n) && n>0 && byId.has(n)) return n;
    if(byLabel.has(String(tok))) return byLabel.get(String(tok));
    return null;
  };
  const cur = multi
    ? new Set((Array.isArray(current)?current:(current?[current]:[])).map(resolve).filter(x=>x))
    : (resolve(current) || 0);

  const draw = ()=>{
    const f = search.value.trim().toLowerCase();
    let matches;
    if(!f){ matches = idx; }
    else {
      // Classement par pertinence : exact (0) → commence par (1) → début de mot (2) → contient (3),
      // puis le plus court d'abord. Ainsi un match exact (« Oise ») remonte devant les « X-sur-Oise ».
      matches = idx.filter(o=>o.lc.includes(f)).map(o=>{
        const i = o.lc.indexOf(f);
        let s;
        if(o.lc === f) s = 0;
        else if(i === 0) s = 1;
        else if(/[^0-9a-zà-öø-ÿ]/.test(o.lc[i-1]||'')) s = 2;   // séparateur juste avant → début de mot
        else s = 3;
        return { o, s, len:o.label.length };
      });
      matches.sort((a,b)=> a.s - b.s || a.len - b.len);
      matches = matches.map(m=>m.o);
    }
    const total = matches.length;
    // garder les éléments déjà sélectionnés visibles en tête (cas multi)
    let head = [];
    if(multi) head = [...cur].filter(id=>!matches.some(o=>o.id===id))
                             .map(id=>({id, label: byId.get(id) ?? id}));
    const shown = head.concat(matches.slice(0, REF_RENDER_LIMIT));
    let html = multi ? '' :
      `<label><input type="radio" name="rp" value="0" ${!cur?'checked':''}><span>— vide —</span></label>`;
    html += shown.map(o=>{
      const inp = multi ? 'type="checkbox"' : 'type="radio" name="rp"';
      const on  = multi ? (cur.has(o.id)?'checked':'') : (cur===o.id?'checked':'');
      return `<label><input ${inp} value="${o.id}" ${on}><span>${escapeHtml(String(o.label))}</span></label>`;
    }).join('');
    if(!shown.length) html = '<span style="color:var(--ink-faint)">Aucun résultat</span>';
    list.innerHTML = html;
    const hidden = total - Math.min(total, REF_RENDER_LIMIT);
    box.querySelector('.count').textContent =
      `${total.toLocaleString('fr-FR')} ligne${total>1?'s':''}` +
      (hidden>0 ? ` · ${hidden.toLocaleString('fr-FR')} masquées, affinez la recherche` : '');
    list.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{
      const id = Number(i.value);
      if(multi){
        if(i.checked) cur.add(id); else cur.delete(id);
        commit(key, ['L', ...[...cur].filter(n=>Number.isInteger(n)&&n>0)], {silent:true});
      } else {
        editingKey=null; commit(key, id||0);  // simple : écrit et ferme
      }
    }));
  };
  draw();
  search.addEventListener('input', draw);
  box.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ e.preventDefault(); editingKey=null; render(); }
    else if(e.key==='Enter' && multi){ e.preventDefault(); editingKey=null; render(); }
  });
}

function editRef(el, key, m, val){ return refPicker(el, key, m, false, (typeof val==='number'?val:0)); }
function editRefList(el, key, m, current){ return refPicker(el, key, m, true, current); }


function editDate(el, key, type, val){
  const input = document.createElement('input');
  input.type = baseType(type)==='DateTime'?'datetime-local':'date';
  input.className='editor';
  if(val!=null && val!==''){
    const ms = typeof val==='number'? val*1000 : Date.parse(val);
    if(!isNaN(ms)){
      const d=new Date(ms); const pad=n=>String(n).padStart(2,'0');
      input.value = input.type==='date'
        ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`
        : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
  }
  el.replaceWith(input); input.focus();
  let closed = false;
  const done = save=>{
    if(closed) return; closed = true;
    if(save){
      const v = input.value? Math.floor(new Date(input.value).getTime()/1000) : null;
      commit(key, v);
    }
    editingKey=null; if(!save) render();
  };
  // Pas de validation sur « change » : sur un input date natif il se déclenche pendant la
  // saisie de l'année et fermerait l'éditeur trop tôt. On valide sur Entrée ou à la sortie du champ.
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); done(true); }
    else if(e.key==='Escape'){ e.preventDefault(); done(false); }
  });
  input.addEventListener('blur', ()=> done(true));
}

/* ============================================================
   Écriture dans Grist
   ============================================================ */
async function commit(colId, value, opts){
  opts = opts || {};
  const prev = CURRENT[colId];
  CURRENT[colId] = value;           // optimiste
  // En démo, le helper d'affichage des références ne se met pas à jour tout seul :
  // on le supprime pour que propRow recalcule le libellé depuis le cache.
  if(!IN_GRIST){ delete CURRENT['gristHelper_Display'+capitalize(colId)]; }
  if(!opts.silent) render();        // silent : on garde l'éditeur ouvert (ex. RefList multi)
  if(!IN_GRIST){ toast('Enregistré (démo)'); return; }
  try{
    if(NAV.length===0){
      await grist.selectedTable.update({ id: CURRENT.id, fields: { [colId]: value } });
    }else{
      await grist.docApi.applyUserActions([['UpdateRecord', ACTIVE_TABLE, CURRENT.id, { [colId]: value }]]);
    }
    toast('Enregistré');
  }catch(err){
    console.error(err);
    CURRENT[colId] = prev; render();
    toast('Échec de l’enregistrement');
  }
}

/* ============================================================
   Connexion à Grist + métadonnées
   ============================================================ */
let METATABLES = null;   // cache {tables, cols} des métatables
let META_CACHE = {};     // tableId -> {META, REFMAP, TABLE_REF}
let ACTIVE_TABLE = null;  // table dont META est actuellement chargé

async function fetchMetatables(){
  if(METATABLES) return METATABLES;
  const [tables, cols] = await Promise.all([
    grist.docApi.fetchTable('_grist_Tables'),
    grist.docApi.fetchTable('_grist_Tables_column'),
  ]);
  COLREF = {};
  for(let i=0;i<cols.id.length;i++) COLREF[cols.id[i]] = cols.colId[i];  // toutes tables
  METATABLES = {tables, cols};
  return METATABLES;
}
function buildMetaFor(tableId){
  if(META_CACHE[tableId]) return META_CACHE[tableId];
  const {tables, cols} = METATABLES;
  let tref=null;
  for(let i=0;i<tables.id.length;i++){ if(tables.tableId[i]===tableId){ tref=tables.id[i]; break; } }
  const meta={}, refmap={};
  for(let i=0;i<cols.id.length;i++){
    if(cols.parentId[i]!==tref) continue;
    refmap[cols.id[i]] = cols.colId[i];
    const colId = cols.colId[i];
    if(colId.startsWith('gristHelper_')||colId==='manualSort') continue;
    meta[colId] = {
      label: cols.label[i] || colId,
      type: cols.type[i] || 'Text',
      isFormula: !!cols.isFormula[i],
      formula: cols.formula ? (cols.formula[i]||'') : '',
      order: cols.parentPos ? cols.parentPos[i] : i,
      wo: parseWO(cols.widgetOptions[i]),
      rules: cols.rules ? cols.rules[i] : null,
      visibleCol: cols.visibleCol ? cols.visibleCol[i] : null,
      displayCol: cols.displayCol ? cols.displayCol[i] : null,   // colonne d'affichage (libellé résolu)
    };
  }
  META_CACHE[tableId] = {META:meta, REFMAP:refmap, TABLE_REF:tref};
  return META_CACHE[tableId];
}
async function loadMetaFor(tableId){
  try{
    await fetchMetatables();
    const m = buildMetaFor(tableId);
    META = m.META; REFMAP = m.REFMAP; TABLE_REF = m.TABLE_REF; ACTIVE_TABLE = tableId;
  }catch(err){ console.warn('Métadonnées indisponibles', err); META = META || {}; }
}
async function loadMeta(){
  TABLE_ID = await grist.selectedTable.getTableId();
  await loadMetaFor(TABLE_ID);
}

/* ---- Navigation vers un enregistrement lié (mini-navigateur) ---- */
async function openRecord(tableId, rowId){
  if(!tableId || !rowId) return;
  if(!IN_GRIST){ toast('Navigation disponible une fois connecté à Grist'); return; }
  if(mdEditor){ try{ mdEditor.destroy(); }catch(_){} mdEditor=null; }
  editingKey=null;
  NAV.push({tableId, rowId: +rowId});
  await showNav();
}
async function showNav(){
  const top = NAV[NAV.length-1];
  await loadMetaFor(top.tableId);
  try{
    const t = await grist.docApi.fetchTable(top.tableId);
    const idx = (t.id||[]).indexOf(top.rowId);
    if(idx<0){ toast('Enregistrement lié introuvable'); NAV.pop(); return navBack(); }
    const rec = { id: top.rowId };
    for(const c in t){ if(c==='id') continue; rec[c] = t[c][idx]; }
    CURRENT = rec;
    render();
    scrollToTop();
    await Promise.all([loadCommentsForCurrent(), preloadRefRows()]);
    render();
  }catch(e){ console.warn('Ouverture impossible', e); toast('Ouverture impossible'); NAV.pop(); }
}
function scrollToTop(){
  try{ window.scrollTo(0,0); }catch(_){}
  try{ if(document.scrollingElement) document.scrollingElement.scrollTop=0; }catch(_){}
  if(document.documentElement) document.documentElement.scrollTop=0;
  if(document.body) document.body.scrollTop=0;
  if(typeof wrap!=='undefined' && wrap) wrap.scrollTop=0;
}
async function navBack(){
  if(NAV.length) NAV.pop();
  if(mdEditor){ try{ mdEditor.destroy(); }catch(_){} mdEditor=null; }
  editingKey=null;
  if(NAV.length===0){
    await loadMetaFor(TABLE_ID);
    CURRENT = BASE_RECORD;
    render();
    scrollToTop();
    await Promise.all([loadCommentsForCurrent(), preloadRefRows()]);
    render();
  } else {
    await showNav();
  }
}

/* ---- Préchargement des tables liées (sous-tableaux RefList) ---- */
async function preloadRefRows(){
  if(!IN_GRIST || !CURRENT || !META) return;
  try{
    await fetchMetatables();
    // Toutes les références (simples et multiples) avec des valeurs : on précharge la
    // table cible pour résoudre les libellés (« montrer la colonne »), même hors sous-tableau.
    const labelTargets = new Set();   // présence suffisante (libellés)
    const freshTargets = new Set();   // sous-tableau : données toujours rafraîchies
    for(const k in META){
      const kind = typeKind(META[k].type);
      if(kind!=='ref' && kind!=='reflist') continue;
      const ids = asList(CURRENT[k]).filter(x=>x!=null && x!=='' && !isEmptyRefValue(x));
      if(!ids.length) continue;
      const t = refTarget(META[k].type); if(!t) continue;
      labelTargets.add(t);
      if(kind==='reflist' && (RL_MODE[k]||'table')==='table') freshTargets.add(t);
    }
    for(const t of labelTargets){
      buildMetaFor(t);                                   // méta de la table liée (cache)
      // rafraîchi pour les sous-tableaux ; sinon chargé une seule fois (perf sur grandes tables)
      if(freshTargets.has(t) || !REFROWS[t]) REFROWS[t] = await grist.docApi.fetchTable(t);
    }
  }catch(e){ console.warn('Préchargement des sous-tableaux impossible', e); }
}

/* ---- Commentaires (lecture seule, depuis la métatable _grist_Cells) ---- */
async function loadCommentsForCurrent(){
  COMMENTS = [];
  if(!IN_GRIST || !CURRENT) return;
  try{
    if(!ALL_CELLS) ALL_CELLS = await grist.docApi.fetchTable('_grist_Cells');
    const c = ALL_CELLS, n = (c.id||[]).length;
    for(let i=0;i<n;i++){
      if(c.tableRef[i]===TABLE_REF && c.rowId[i]===CURRENT.id){
        COMMENTS.push({
          id: c.id[i],
          colRef: c.colRef ? c.colRef[i] : 0,
          content: c.content ? c.content[i] : null,
          userRef: c.userRef ? c.userRef[i] : null,
          type: c.type ? c.type[i] : null,
        });
      }
    }
  }catch(e){ console.warn('Commentaires indisponibles', e); }
}

function commentsHtml(){
  if(!COMMENTS.length) return '';
  const fmtTs = ts=>{
    if(ts==null) return '';
    const ms = ts>1e11 ? ts : ts*1000;
    const d = new Date(ms); if(isNaN(d)) return '';
    return d.toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
  };
  let items = COMMENTS.map(cm=>{
    let o=null; try{ o = cm.content!=null ? JSON.parse(cm.content) : null; }catch(_){}
    const text   = o && o.text!=null ? o.text : (cm.content!=null ? String(cm.content) : '');
    const author = o && (o.userName||o.author) ? (o.userName||o.author) : (cm.userRef||'');
    const date   = fmtTs(o ? (o.timeCreated ?? o.timeUpdated ?? o.time) : null);
    const colLab = cm.colRef && COLREF[cm.colRef] ? (META?.[COLREF[cm.colRef]]?.label || COLREF[cm.colRef]) : '';
    const resolved = o && o.resolved;
    return `<div class="cmt ${resolved?'resolved':''}">
        <div class="cmt-head">
          <span class="cmt-author">${escapeHtml(author||'—')}</span>
          ${colLab?`<span class="cmt-col">${escapeHtml(colLab)}</span>`:''}
          ${date?`<span class="cmt-date">${escapeHtml(date)}</span>`:''}
          ${resolved?`<span class="cmt-res">résolu</span>`:''}
        </div>
        <div class="cmt-text">${text? renderMd(text) : '<span style="color:var(--ink-faint)">(vide)</span>'}</div>
      </div>`;
  }).join('');
  return `<details class="folded comments"><summary>
      <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      Commentaires (${COMMENTS.length})</summary><div class="folded-body cmts">${items}</div></details>`;
}

/* Persistance dans les options du widget (par widget) : champs repliés + titre */
function gristOptionsApi(){ return (typeof grist!=='undefined' && grist.widgetApi) ? grist.widgetApi : (typeof grist!=='undefined' ? grist : null); }
function configPayload(){
  // Paramétrage réutilisable (sans linkTemplate, propre à chaque page)
  return { collapsed:[...FOLDED], order: ORDER, title: TITLE_KEY, subtitle: SUBTITLE_KEY, tags: TAGS_KEY, headerImage: HEADER_IMG,
           reflistMode: RL_MODE, reflistCols: RL_COLS, link: LINK_KEY, buttons:[...BTN_FIELDS] };
}
function applyConfigJson(text){
  let obj; try{ obj = JSON.parse(text); }catch(e){ toast('Config illisible (JSON invalide)'); return; }
  if(!obj || typeof obj!=='object'){ toast('Config invalide'); return; }
  delete obj.linkTemplate;            // ne pas écraser le modèle de lien de cette page
  applyOptions(obj); saveOptions(); render();
  const bits=[];
  if('title' in obj) bits.push('titre');
  if('subtitle' in obj) bits.push('sous-titre');
  if('tags' in obj) bits.push('tags');
  if('headerImage' in obj) bits.push('image');
  if(Array.isArray(obj.order) && obj.order.length) bits.push('ordre');
  if(Array.isArray(obj.collapsed)) bits.push(`${obj.collapsed.length} replié${obj.collapsed.length>1?'s':''}`);
  if(obj.reflistMode) bits.push('listes réf.');
  if(Array.isArray(obj.buttons)) bits.push('boutons');
  toast('Appliqué — ' + (bits.join(', ') || 'rien à appliquer'));
}
function applyOptions(opts){
  if(!opts) return;
  if(Array.isArray(opts.collapsed)) FOLDED = new Set(opts.collapsed);
  if(Array.isArray(opts.order)) ORDER = opts.order.slice();
  if('title' in opts) TITLE_KEY = opts.title || null;
  if('subtitle' in opts) SUBTITLE_KEY = opts.subtitle || null;
  if('tags' in opts) TAGS_KEY = opts.tags || null;
  if('headerImage' in opts) HEADER_IMG = opts.headerImage || null;
  if(opts.reflistMode && typeof opts.reflistMode==='object') RL_MODE = {...opts.reflistMode};
  if(opts.reflistCols && typeof opts.reflistCols==='object') RL_COLS = {...opts.reflistCols};
  if('link' in opts) LINK_KEY = opts.link || 'auto';
  if(Array.isArray(opts.buttons)) BTN_FIELDS = new Set(opts.buttons);
  if('linkTemplate' in opts) LINK_TEMPLATE = opts.linkTemplate || '';
}
async function saveOptions(){
  if(!IN_GRIST) return;
  try{
    const api = gristOptionsApi();
    const payload = { collapsed:[...FOLDED], order: ORDER, title: TITLE_KEY, subtitle: SUBTITLE_KEY, tags: TAGS_KEY, headerImage: HEADER_IMG,
                      reflistMode: RL_MODE, reflistCols: RL_COLS, link: LINK_KEY, buttons:[...BTN_FIELDS], linkTemplate: LINK_TEMPLATE };
    if(api && api.setOptions) await api.setOptions(payload);
    else if(api && api.setOption){ for(const [k,v] of Object.entries(payload)) await api.setOption(k, v); }
  }catch(e){ console.warn('Sauvegarde des options impossible', e); }
}

function initGrist(){
  if(typeof grist==='undefined') return false;
  IN_GRIST = true;
  grist.ready({ requiredAccess:'full' });
  // options (champs repliés) — onOptions se déclenche au démarrage et à chaque changement
  try{
    if(grist.onOptions) grist.onOptions((opts)=>{ applyOptions(opts); if(CURRENT) render(); });
  }catch(_){}
  // expandRefs:false → les colonnes Référence / Liste de références arrivent en
  // row ids (et non en libellés), pour un rapprochement fiable par identifiant
  // dans les sous-tableaux (les noms ne sont pas uniques). Les libellés restent
  // fournis par les colonnes gristHelper_Display.
  grist.onRecord(async (record)=>{
    if(!META || Object.keys(META).length===0) await loadMeta();
    // Enregistrement absent ou vide
    if(!record || record.id==null || record.id===0){
      BASE_RECORD = null;
      if(NAV.length===0){
        if(mdEditor){ try{ mdEditor.destroy(); }catch(_){} mdEditor=null; }
        editingKey=null; CURRENT = null; COMMENTS = []; render();
      }
      return;
    }
    BASE_RECORD = record;
    if(NAV.length>0) return;     // on navigue dans un enregistrement lié : ne pas écraser
    // Édition en cours sur le même enregistrement : ne pas re-rendre (préserve l'éditeur)
    if(editingKey && CURRENT && record.id===CURRENT.id){ CURRENT = record; return; }
    if(mdEditor){ try{ mdEditor.destroy(); }catch(_){} mdEditor=null; }
    editingKey=null;
    if(ACTIVE_TABLE!==TABLE_ID) await loadMetaFor(TABLE_ID);
    CURRENT = record;
    render();
    await Promise.all([loadCommentsForCurrent(), preloadRefRows()]);
    render();
  }, { expandRefs:false });
  // Curseur sur une ligne vide / aucun enregistrement lié → vider la fiche
  try{
    if(grist.onNewRecord) grist.onNewRecord(()=>{ CURRENT = null; COMMENTS = []; render(); });
  }catch(_){}
  return true;
}
