name: Deploy widget vers AlwaysData

# Déploie UNIQUEMENT grist-fiche-widget.html vers l'hébergement AlwaysData.
# Aucun identifiant dans le dépôt : tout passe par les GitHub Secrets.

on:
  push:
    branches: [main]
    paths:
      - grist-fiche-widget.html   # ne déclenche que si le HTML change
      - deploy/htaccess           # ...ou la config anti-cache
  workflow_dispatch:              # + déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installe sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Enregistre l'empreinte du serveur
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.ALWAYSDATA_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Envoi du fichier HTML (rsync + mot de passe)
        env:
          SSHPASS: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
        run: |
          DEST_DIR="$(dirname "${{ secrets.ALWAYSDATA_TARGET_PATH }}")"
          SSH_OPTS="ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          # Le widget (renommé widget.html côté serveur)
          sshpass -e rsync -avz --mkpath -e "$SSH_OPTS" \
            grist-fiche-widget.html \
            "${{ secrets.ALWAYSDATA_SSH_USER }}@${{ secrets.ALWAYSDATA_SSH_HOST }}:${{ secrets.ALWAYSDATA_TARGET_PATH }}"
          # La config anti-cache (renommée .htaccess dans le même dossier)
          sshpass -e rsync -avz --mkpath -e "$SSH_OPTS" \
            deploy/htaccess \
            "${{ secrets.ALWAYSDATA_SSH_USER }}@${{ secrets.ALWAYSDATA_SSH_HOST }}:${DEST_DIR}/.htaccess"
